services:
  - type: web
    name: sheerid-es-production-tool
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: sheerid-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/sheerid.sqlite
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Workspace Admin
      - key: ADMIN_PASSWORD
        sync: false
